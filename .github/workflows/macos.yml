name: macOS build and test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'data/resources/**', 'tests/**', 'scripts/verify-macos.py', 'package*.json', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build app and DMG (ad-hoc signed test build)
        run: npm run tauri -- build --ci --target ${{ matrix.target }}
      - name: Verify resources, binary architecture, signature and launch
        run: python3 scripts/verify-macos.py ${{ matrix.target }}
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DST-SwapFit-macOS-${{ matrix.target }}-test
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            macos-smoke.log
          if-no-files-found: error
          retention-days: 14
